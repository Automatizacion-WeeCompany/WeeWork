name: Build Tauri App

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Build Tauri App (Windows)
        run: npm run tauri build

      # 🧠 Obtener nombre del .exe generado
      - name: Obtener instalador
        id: get_exe
        shell: bash
        run: |
          FILE=$(ls src-tauri/target/release/bundle/**/*.exe | head -n 1)
          echo "exe_path=$FILE" >> $GITHUB_OUTPUT
          echo "exe_name=$(basename $FILE)" >> $GITHUB_OUTPUT

      # 🔐 Firmar correctamente (en bash para evitar errores)
      - name: Firmar instalador
        id: sign
        shell: bash
        run: |
          FILE="${{ steps.get_exe.outputs.exe_path }}"

          npx tauri signer sign \
            --private-key "$TAURI_PRIVATE_KEY" \
            --password "$TAURI_KEY_PASSWORD" \
            --artifact-path "$FILE" \
            --output signature.txt

          echo "signature=$(cat signature.txt)" >> $GITHUB_OUTPUT

      # 🧠 Generar update.json con firma REAL
      - name: Generar update.json
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME}
          EXE_NAME=${{ steps.get_exe.outputs.exe_name }}
          SIG=${{ steps.sign.outputs.signature }}

          echo "{
            \"version\": \"$VERSION\",
            \"notes\": \"Auto update\",
            \"pub_date\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\",
            \"platforms\": {
              \"windows-x86_64\": {
                \"signature\": \"$SIG\",
                \"url\": \"https://github.com/${{ github.repository }}/releases/download/$VERSION/$EXE_NAME\"
              }
            }
          }" > update.json

      # 📦 Subir artefactos
      - name: Subir Windows al release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/**/*.exe
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Build Tauri App (macOS)
        run: npm run tauri build

      - name: Subir DMG al release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
