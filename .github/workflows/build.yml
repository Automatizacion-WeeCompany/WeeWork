name: Build Tauri App

on:
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Build Tauri App (Windows)
        run: npm run tauri build

      # 🔐 Firma Tauri (para updater)
      - name: Firmar con Tauri
        run: |
          npx tauri signer sign ^
            --private-key "${{ secrets.TAURI_PRIVATE_KEY }}" ^
            --password "${{ secrets.TAURI_KEY_PASSWORD }}" ^
            --artifact-path src-tauri/target/release/bundle/**/*.exe ^
            --output signature.txt

      # 🧠 Generar update.json SOLO para Windows
      - name: Generar update.json
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME}
          SIG=$(cat signature.txt)

          echo "{
            \"version\": \"$VERSION\",
            \"notes\": \"Auto release\",
            \"pub_date\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\",
            \"platforms\": {
              \"windows-x86_64\": {
                \"signature\": \"$SIG\",
                \"url\": \"https://github.com/${{ github.repository }}/releases/download/$VERSION/QA-Automation-Suite-$VERSION-setup.exe\"
              }
            }
          }" > update.json

      # 📦 Subir .exe + update.json
      - name: Subir Windows al release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/**/*.exe
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Build Tauri App (macOS)
        run: npm run tauri build

      # 📦 Subir SOLO el .dmg
      - name: Subir DMG al release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
